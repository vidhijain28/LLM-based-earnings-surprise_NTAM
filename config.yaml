# Pipeline configuration for `doit` (see dodo.py).
#
# Any of period.start, period.end and universe can be overridden at run time without editing this file:
#   uv run doit start=2024-01-01 end=2024-12-31
#   uv run doit start=2025-10-01 end=2025-12-31 universe=global
#   uv run doit config=other_config.yaml

period:
  start: 2025-10-01        # first call date to include (inclusive)
  end: 2025-12-31          # last call date to include (inclusive)

universe: us               # us     = US-headquartered companies, IBES US file
                           # global = all companies, IBES US + international files

wrds_username: tkwsean        # null = WRDS default (pgpass / environment)

paths:
  raw: data/raw            # monthly WRDS pulls (cached; reused across periods)
  interim: data/interim    # cleaned transcripts, IBES announcements, links
  processed: data/processed

transcripts:
  version_rule: pit        # pit   = first version created for each call (what you would have had in real time)
                           # final = Final version, latest created (best text quality, may arrive days later)
  max_lag_days: null       # drop calls whose chosen version was created more than N days after the call
                           # (null = keep all; e.g. 1 keeps only transcripts available by the next day)
  min_words: 500           # drop transcripts shorter than this (empty or truncated)

ibes:
  consensus: detail        # detail  = built from analyst-level estimates (detu): each analyst's latest estimate made
                           #           before the release (same-day estimates count if made before the release time),
                           #           made or confirmed within detail_window_days, and not stopped by the broker
                           #           (closest to the paper's consensus "right before the release")
                           # summary = last monthly IBES consensus snapshot (statsumu) before the release day
  consensus_stat: mean     # mean (as in the paper) | median
  detail_window_days: 90   # an estimate must have been made or last confirmed within this many days of the release
  price_source: compustat  # compustat = close on the trading day before the event date (Compustat daily, primary
                           #              US issue), falling back to the IBES price when unavailable
                           # ibes       = last monthly IBES price snapshot before the release
  min_price: 1.0           # SUE is left missing when the pre-announcement price is below this

match:
  window_days: [-1, 3]     # accept IBES announcements with call_date - anndats in this range
  release_cutoff_et: "16:00"  # event date = release day if released by this time (ET) on a trading day,
                              # otherwise the next trading day (Koijen & Levy rule)

output:
  include_text: true       # include transcript text columns in the final file

# --- extension: event-date returns and estimation sample (PIPELINE.md section 5) ---

returns:
  market_permno: 90878     # CRSP permno of the market proxy (90878 = VTI, the ETF used by Koijen & Levy)

sample:
  require_transcript_by_event_close: false  # also require the chosen transcript to exist by 16:00 ET on the event date
  baseline_r2_warn: 0.05                    # warn when the surprise-only R2 falls below this (paper: 5.0%)
